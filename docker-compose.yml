# 팀 공통 로컬 인프라 (Docker Desktop)
# 사용: docker compose -p pet-health up -d
name: pet-health

services:
  mysql:
    image: mysql:8.4
    container_name: pet-health-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --ngram_token_size=2
      - --innodb_ft_enable_stopword=0
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3316:3306"
    volumes:
      - pet-health-mysql:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  kafka:
    image: apache/kafka:3.9.1
    container_name: pet-health-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - pet-health-kafka:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: pet-health-kafka-init
    depends_on:
      - kafka
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  mongo:
    image: mongo:7
    container_name: pet-health-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vetconsult
    volumes:
      - pet-health-mongo:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro

volumes:
  pet-health-mysql:
  pet-health-kafka:
  pet-health-mongo:
